version: 2

models:
  - name: mart_renewables_leaders
    description: "Ranking anual de países por porcentaje de energía renovable. Incluye posición con RANK()."
    columns:
      - name: geo
        description: "Código de país (ISO 2 letras)"
        tests:
          - not_null
      - name: year
        description: "Año de la observación"
        tests:
          - not_null
      - name: renewables_pct
        description: "Porcentaje de renovables sobre el total de energía"
        tests:
          - not_null
      - name: rank_by_year
        description: "Posición del país ese año, ordenado de mayor a menor participación renovable"
        tests:
          - not_null

  - name: mart_crisis_2022_prices
    description: "Precios de electricidad con desviación respecto al promedio histórico por país."
    columns:
      - name: geo
        description: "Código de país (ISO 2 letras)"
        tests:
          - not_null
      - name: year
        description: "Año de la observación"
        tests:
          - not_null
      - name: price_eur_kwh
        description: "Precio de electricidad en EUR por kWh"
        tests:
          - not_null
      - name: avg_price_by_country
        description: "Precio promedio histórico del país en todo el período"
        tests:
          - not_null
      - name: deviation_from_avg
        description: "Diferencia absoluta entre el precio del período y el promedio histórico del país"
        tests:
          - not_null

  - name: mart_dependency_vs_price
    description: "Países clasificados por nivel de dependencia energética con etiqueta categórica."
    columns:
      - name: geo
        description: "Código de país (ISO 2 letras)"
        tests:
          - not_null
      - name: year
        description: "Año de la observación"
        tests:
          - not_null
      - name: dependency_pct
        description: "Porcentaje de dependencia energética del exterior"
        tests:
          - not_null
      - name: avg_price_eur_kwh
        description: "Precio promedio de electricidad en EUR por kWh"
        tests:
          - not_null
      - name: dependency_category
        description: "Categoría de dependencia energética del país"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Baja dependencia', 'Dependencia media', 'Alta dependencia']