version: 2

models:
  - name: stg_renewables_leaders
    description: "Vista de staging sobre renewables_leaders. Países EU con participación de renovables por año."
    columns:
      - name: geo
        description: "Código de país (ISO 2 letras)"
        tests:
          - not_null
      - name: year
        description: "Año de la observación"
        tests:
          - not_null
      - name: renewables_pct
        description: "Porcentaje de renovables sobre el total de energía"
        tests:
          - not_null

  - name: stg_crisis_2022_prices
    description: "Vista de staging sobre crisis_2022_prices. Precios de electricidad por semestre y país."
    columns:
      - name: geo
        description: "Código de país (ISO 2 letras)"
        tests:
          - not_null
      - name: year
        description: "Año de la observación"
        tests:
          - not_null
      - name: price_eur_kwh
        description: "Precio de electricidad en EUR por kWh"
        tests:
          - not_null

  - name: stg_dependency_vs_price
    description: "Vista de staging sobre dependency_vs_price. Dependencia energética y precio promedio por país y año."
    columns:
      - name: geo
        description: "Código de país (ISO 2 letras)"
        tests:
          - not_null
      - name: year
        description: "Año de la observación"
        tests:
          - not_null
      - name: dependency_pct
        description: "Porcentaje de dependencia energética del exterior"
        tests:
          - not_null
      - name: avg_price_eur_kwh
        description: "Precio promedio de electricidad en EUR por kWh"
        tests:
          - not_null